<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>

  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2328">This repository is its own marketplace</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#656d76">The placed copy and the developed copy are one tree, so the units are used the way they ship.</text>

  <rect x="30" y="92" width="300" height="216" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="180" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">dogkeeper886/agent-workflows</text>
  <rect x="54" y="136" width="252" height="44" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
  <text x="180" y="163" text-anchor="middle" font-size="13" fill="#1f2328">.claude-plugin/marketplace.json</text>
  <rect x="54" y="192" width="252" height="44" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
  <text x="180" y="219" text-anchor="middle" font-size="13" fill="#1f2328">plugins/agent-workflows/ · 14 skills</text>
  <rect x="54" y="248" width="252" height="44" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
  <text x="180" y="275" text-anchor="middle" font-size="13" fill="#1f2328">.sessions/ · raw agent transcripts</text>

  <line x1="330" y1="158" x2="418" y2="158" stroke="#57606a" stroke-width="1.5" marker-end="url(#c)"/>
  <line x1="330" y1="252" x2="418" y2="252" stroke="#57606a" stroke-width="1.5" marker-end="url(#c)"/>

  <rect x="420" y="112" width="450" height="92" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="444" y="138" font-size="14" font-weight="600" fill="#0a3069">added as a directory</text>
  <text x="444" y="162" font-size="13" fill="#0a3069">the working tree is what loads</text>
  <text x="444" y="184" font-size="13" fill="#0a3069">a restart picks up edits that are not committed yet</text>

  <rect x="420" y="216" width="450" height="92" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="444" y="242" font-size="14" font-weight="600" fill="#1f2328">added from GitHub</text>
  <text x="444" y="266" font-size="13" fill="#1f2328">a snapshot pinned to a commit; the commit is the version</text>
  <text x="444" y="288" font-size="13" fill="#1f2328">/plugin marketplace update agent-workflows</text>

  <text x="450" y="346" text-anchor="middle" font-size="13" fill="#656d76">Either way, read known_marketplaces.json to see which one you are in.</text>
  <text x="450" y="366" text-anchor="middle" font-size="13" fill="#656d76">installed_plugins.json points into a cache that may be many commits stale.</text>
</svg>
