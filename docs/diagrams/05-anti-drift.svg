<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="780" height="380" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="40" y="32" font-size="17" font-weight="700" fill="#0f172a">qa-workflow anti-drift — test ↔ script ↔ story</text>
  <text x="40" y="52" font-size="12.5" fill="#475569">The test doc records the story it verifies, plus a hash of that story.</text>

  <rect x="40" y="78" width="190" height="72" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="135" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">STORY-007</text>
  <text x="135" y="130" text-anchor="middle" font-size="12" fill="#475569">story_hash: a1b2c3</text>
  <line x1="230" y1="114" x2="298" y2="114" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="264" y="106" text-anchor="middle" font-size="10.5" fill="#64748b">verifies</text>

  <rect x="300" y="78" width="190" height="72" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="395" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#115e59">test doc</text>
  <text x="395" y="130" text-anchor="middle" font-size="12" fill="#0f766e">records story + hash</text>
  <line x1="490" y1="114" x2="558" y2="114" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="524" y="106" text-anchor="middle" font-size="10.5" fill="#64748b">maps to</text>

  <rect x="560" y="78" width="180" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="650" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">script</text>
  <text x="650" y="130" text-anchor="middle" font-size="12" fill="#2563eb">(runner repo)</text>

  <text x="40" y="208" font-size="13.5" font-weight="700" fill="#0f172a">When the story changes:</text>

  <rect x="40" y="226" width="190" height="72" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="135" y="256" text-anchor="middle" font-size="13.5" font-weight="600" fill="#991b1b">STORY-007 edited</text>
  <text x="135" y="278" text-anchor="middle" font-size="12" fill="#dc2626">story_hash: z9y8x7</text>
  <line x1="230" y1="262" x2="298" y2="262" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="300" y="226" width="190" height="72" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="395" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">hash ≠ recorded</text>
  <text x="395" y="278" text-anchor="middle" font-size="12" fill="#ea580c">z9y8x7 ≠ a1b2c3</text>
  <line x1="490" y1="262" x2="558" y2="262" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="560" y="226" width="180" height="72" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="650" y="262" text-anchor="middle" font-size="13.5" font-weight="600" fill="#92400e">⚠ flagged stale</text>
  <text x="650" y="282" text-anchor="middle" font-size="11.5" fill="#b45309">drift caught early</text>

  <path d="M395,150 L395,226" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4 4" fill="none" marker-end="url(#a)"/>
  <text x="405" y="190" font-size="10.5" fill="#0f766e">recorded hash is re-checked</text>
</svg>
