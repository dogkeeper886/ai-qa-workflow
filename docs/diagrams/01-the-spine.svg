<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>

  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2328">One piece of work, from a remark to merged</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#656d76">The issue is the portal. Every step resolves back to it, so nobody carries context forward by hand.</text>

  <g stroke="#57606a" stroke-width="1.5" fill="#f6f8fa">
    <rect x="14"  y="86" width="132" height="48" rx="6"/>
    <rect x="174" y="86" width="132" height="48" rx="6"/>
    <rect x="334" y="86" width="132" height="48" rx="6"/>
    <rect x="494" y="86" width="132" height="48" rx="6"/>
    <rect x="654" y="86" width="132" height="48" rx="6"/>
    <rect x="814" y="86" width="132" height="48" rx="6"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#1f2328">
    <text x="80"  y="115">file-issue</text>
    <text x="240" y="115">take-issue</text>
    <text x="400" y="115">do-task</text>
    <text x="560" y="115">review-work</text>
    <text x="720" y="115">open-pr</text>
    <text x="880" y="115">land-pr</text>
  </g>
  <g stroke="#57606a" stroke-width="1.5" marker-end="url(#a)">
    <line x1="146" y1="110" x2="172" y2="110"/>
    <line x1="306" y1="110" x2="332" y2="110"/>
    <line x1="466" y1="110" x2="492" y2="110"/>
    <line x1="626" y1="110" x2="652" y2="110"/>
    <line x1="786" y1="110" x2="812" y2="110"/>
  </g>
  <text x="639" y="76" text-anchor="middle" font-size="11" font-weight="600" fill="#0969da">done</text>
  <text x="880" y="152" text-anchor="middle" font-size="11" fill="#656d76">merged, branch gone</text>

  <line x1="560" y1="134" x2="560" y2="186" stroke="#9a6700" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="212" y="190" width="536" height="132" rx="6" fill="#fff8e5" stroke="#9a6700" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="480" y="214" text-anchor="middle" font-size="14" font-weight="600" fill="#7a4f01">Four of its five outcomes do not advance</text>
  <g font-size="13" fill="#4d3800">
    <text x="244" y="242">half done</text>
    <text x="244" y="266">stuck</text>
    <text x="244" y="290">more than one task</text>
    <text x="244" y="314">not started</text>
  </g>
  <g font-size="13" fill="#7a4f01">
    <text x="440" y="242">back to do-task</text>
    <text x="440" y="266">back to the issue, unassigned</text>
    <text x="440" y="290">up to plan-work, to be split</text>
    <text x="440" y="314">back to the issue</text>
  </g>
  <g font-size="13" fill="#9a6700">
    <text x="416" y="242">→</text>
    <text x="416" y="266">→</text>
    <text x="416" y="290">→</text>
    <text x="416" y="314">→</text>
  </g>

  <text x="480" y="352" text-anchor="middle" font-size="13" fill="#656d76">State lives on the platform: the issue, its labels, the branch, the change request. The toolkit keeps none of its own.</text>
  <text x="480" y="376" text-anchor="middle" font-size="13" fill="#656d76">Every step stops for a person. Nothing auto-runs the next.</text>
</svg>
