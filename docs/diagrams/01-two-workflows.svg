<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="280" y="24" width="200" height="48" rx="8" fill="#0f172a"/>
  <text x="380" y="54" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">agent-workflows</text>
  <text x="380" y="94" text-anchor="middle" fill="#475569" font-size="13">Slash commands that make an agent follow an exact, documented order</text>
  <path d="M360,108 L210,146" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M400,108 L550,146" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="40" y="152" width="320" height="142" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="184" fill="#1e3a8a" font-size="16" font-weight="700">dev-workflow</text>
  <text x="320" y="184" text-anchor="end" fill="#2563eb" font-size="13" font-weight="600">dw-*</text>
  <text x="60" y="212" fill="#0f172a" font-size="13">An ordered action lifecycle:</text>
  <text x="60" y="232" fill="#0f172a" font-size="13" font-weight="600">story → plan → implement → PR → merge</text>
  <text x="60" y="258" fill="#475569" font-size="12.5">Each step paired with a review.</text>
  <text x="60" y="277" fill="#475569" font-size="12.5">Nothing skips ahead.</text>
  <rect x="400" y="152" width="320" height="142" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="420" y="184" fill="#115e59" font-size="16" font-weight="700">qa-workflow</text>
  <text x="700" y="184" text-anchor="end" fill="#0d9488" font-size="13" font-weight="600">qw-*</text>
  <text x="420" y="212" fill="#0f172a" font-size="13">Test docs kept separate from the</text>
  <text x="420" y="232" fill="#0f172a" font-size="13">scripts, mapped to the story:</text>
  <text x="420" y="256" fill="#0f172a" font-size="13" font-weight="600">test ↔ script ↔ story</text>
  <text x="420" y="278" fill="#475569" font-size="12.5">Catches coverage drift.</text>
</svg>
