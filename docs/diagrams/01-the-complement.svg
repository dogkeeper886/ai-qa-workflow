<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="380" y="34" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">One pipeline, two halves — install both</text>

  <!-- left half: mattpocock/skills -->
  <rect x="32" y="60" width="332" height="182" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="52" y="90" fill="#5b21b6" font-size="15" font-weight="700">mattpocock/skills</text>
  <text x="344" y="90" text-anchor="end" fill="#7c3aed" font-size="12.5" font-weight="600">idea → commit</text>
  <text x="52" y="120" fill="#0f172a" font-size="12.5">/grill-with-docs</text>
  <text x="52" y="142" fill="#0f172a" font-size="12.5">/to-spec</text>
  <text x="52" y="164" fill="#0f172a" font-size="12.5">/to-tickets</text>
  <text x="52" y="186" fill="#0f172a" font-size="12.5">/implement</text>
  <text x="52" y="208" fill="#0f172a" font-size="12.5">/code-review-2axis</text>
  <text x="52" y="230" fill="#7c3aed" font-size="12.5" font-style="italic">ends at a commit</text>

  <!-- right half: agent-workflows -->
  <rect x="396" y="60" width="332" height="182" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="416" y="90" fill="#1e3a8a" font-size="15" font-weight="700">agent-workflows</text>
  <text x="708" y="90" text-anchor="end" fill="#2563eb" font-size="12.5" font-weight="600">commit → merged</text>
  <text x="416" y="120" fill="#0f172a" font-size="12.5">reviewing-finish</text>
  <text x="416" y="140" fill="#475569" font-size="11.5">run the tooling · clear leftovers + orphans</text>
  <text x="416" y="168" fill="#0f172a" font-size="12.5">/ship-create-pr</text>
  <text x="416" y="188" fill="#475569" font-size="11.5">push · open the PR · link it to its issue</text>
  <text x="416" y="216" fill="#0f172a" font-size="12.5">/ship-merge</text>
  <text x="416" y="236" fill="#475569" font-size="11.5">merge · clear the labels · delete the branch</text>

  <!-- handoff arrow -->
  <path d="M366,151 L394,151" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- also shipped -->
  <rect x="32" y="262" width="696" height="52" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="285" fill="#0f172a" font-size="12.5" font-weight="600">Also shipped:</text>
  <text x="146" y="285" fill="#0f172a" font-size="12.5">the report contract · review gates for existing docs · doc-workflow</text>
  <text x="52" y="304" fill="#475569" font-size="11.5">Nothing here duplicates the left half. What competed with it was deleted — see ADR-0002.</text>
</svg>
