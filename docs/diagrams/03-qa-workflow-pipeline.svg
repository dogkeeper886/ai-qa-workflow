<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 404" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="900" height="404" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="20" y="32" font-size="17" font-weight="700" fill="#0f172a">qa-workflow — the full lifecycle across two repos</text>

  <!-- Lane 1: authoring -->
  <rect x="20" y="56" width="860" height="148" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="38" y="82" font-size="13" font-weight="700" fill="#0f766e">agent-workflows  ·  authoring</text>

  <rect x="38" y="100" width="180" height="68" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="128" y="129" text-anchor="middle" font-size="13.5" font-weight="600" fill="#115e59">qw-plan</text>
  <text x="128" y="148" text-anchor="middle" font-size="11.5" fill="#0f766e">plan what to test</text>
  <line x1="220" y1="134" x2="246" y2="134" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="248" y="100" width="180" height="68" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="338" y="129" text-anchor="middle" font-size="13" fill="#92400e">qw-review-plan</text>
  <text x="338" y="148" text-anchor="middle" font-size="11.5" fill="#b45309">gate the plan</text>
  <line x1="430" y1="134" x2="456" y2="134" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="458" y="100" width="180" height="68" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="548" y="129" text-anchor="middle" font-size="13.5" font-weight="600" fill="#115e59">qw-cases</text>
  <text x="548" y="148" text-anchor="middle" font-size="11.5" fill="#0f766e">write docs/tests/</text>
  <line x1="640" y1="134" x2="666" y2="134" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="668" y="100" width="180" height="68" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="758" y="129" text-anchor="middle" font-size="13" fill="#92400e">qw-review-cases</text>
  <text x="758" y="148" text-anchor="middle" font-size="11.5" fill="#b45309">gate the docs</text>

  <!-- Handoff -->
  <path d="M758,168 L758,220 L128,220 L128,278" stroke="#0d9488" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="372" y="208" width="200" height="24" rx="12" fill="#ffffff"/>
  <text x="472" y="225" text-anchor="middle" font-size="12" font-weight="600" fill="#0f766e">test docs hand off to the runner</text>

  <!-- Lane 2: execution -->
  <rect x="20" y="236" width="860" height="148" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="262" font-size="13" font-weight="700" fill="#475569">agent-workflows-runner  ·  execution</text>

  <rect x="38" y="280" width="180" height="68" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="128" y="309" text-anchor="middle" font-size="13.5" font-weight="600" fill="#115e59">qw-bind</text>
  <text x="128" y="328" text-anchor="middle" font-size="11.5" fill="#0f766e">link case → executable</text>
  <line x1="220" y1="314" x2="246" y2="314" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="248" y="280" width="180" height="68" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="338" y="309" text-anchor="middle" font-size="13" fill="#92400e">qw-review-bind</text>
  <text x="338" y="328" text-anchor="middle" font-size="11.5" fill="#b45309">doc ↔ exe agree?</text>
  <line x1="430" y1="314" x2="456" y2="314" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="458" y="280" width="180" height="68" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="548" y="305" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e3a8a">ci-run</text>
  <text x="548" y="323" text-anchor="middle" font-size="11" fill="#2563eb">execute · dual-judge</text>
  <text x="548" y="339" text-anchor="middle" font-size="10" fill="#60a5fa">(skill)</text>
  <line x1="640" y1="314" x2="666" y2="314" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="668" y="280" width="180" height="68" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="758" y="309" text-anchor="middle" font-size="13.5" fill="#92400e">qw-drift</text>
  <text x="758" y="328" text-anchor="middle" font-size="11.5" fill="#b45309">flag stale tests</text>
</svg>
