<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="800" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="30" y="30" font-size="17" font-weight="700" fill="#0f172a">Review skills — match the reviewer to who reads the file</text>

  <rect x="30" y="118" width="170" height="64" rx="8" fill="#0f172a"/>
  <text x="115" y="148" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ffffff">the file you</text>
  <text x="115" y="166" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ffffff">changed</text>

  <path d="M200,138 L292,90" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M200,162 L292,210" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="298" y="58" width="244" height="66" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="314" y="84" font-size="13.5" font-weight="700" fill="#14532d">Human-read doc</text>
  <text x="314" y="105" font-size="12" fill="#15803d">README, docs/ prose</text>

  <rect x="298" y="200" width="244" height="66" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="314" y="226" font-size="13.5" font-weight="700" fill="#1e3a8a">Agent-read tooling</text>
  <text x="314" y="247" font-size="12" fill="#2563eb">commands, skills, CLAUDE.md, rules</text>

  <path d="M542,80 L596,66" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M542,102 L596,120" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M542,233 L596,233" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="600" y="46" width="190" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="695" y="66" text-anchor="middle" font-size="12.5" font-weight="600" fill="#14532d">reviewing-phrasing</text>
  <text x="695" y="82" text-anchor="middle" font-size="11" fill="#15803d">the words</text>

  <rect x="600" y="98" width="190" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="695" y="118" text-anchor="middle" font-size="12.5" font-weight="600" fill="#14532d">reviewing-typography</text>
  <text x="695" y="134" text-anchor="middle" font-size="11" fill="#15803d">the look</text>

  <rect x="600" y="210" width="190" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="695" y="231" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">reviewing-artifacts</text>
  <text x="695" y="247" text-anchor="middle" font-size="11" fill="#2563eb">does it do its job?</text>
</svg>
